<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halal Live Food Scanner</title>
    <!-- QuaggaJS for Camera Barcode Scanning -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --danger: #ef4444;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        h1 {
            text-align: center;
            color: var(--primary-dark);
            margin-bottom: 8px;
        }

        p.subtitle {
            text-align: center;
            color: #64748b;
            margin-top: 0;
            margin-bottom: 24px;
        }

        .scanner-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            font-size: 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        button {
            padding: 12px 16px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background-color: var(--primary);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-dark);
        }

        .camera-btn {
            background-color: #3b82f6;
        }
        .camera-btn:hover {
            background-color: #2563eb;
        }

        /* Camera Viewport Styling */
        #interactive.viewport {
            position: relative;
            width: 100%;
            height: 250px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            display: none;
            margin-bottom: 12px;
        }
        #interactive.viewport video, canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .result-card {
            border-radius: 12px;
            padding: 20px;
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-card.halal {
            background-color: #ecfdf5;
            border: 2px solid #34d399;
            color: #065f46;
        }

        .result-card.haram {
            background-color: #fef2f2;
            border: 2px solid #f87171;
            color: #991b1b;
        }

        .result-card h2 {
            margin-top: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ingredients-list {
            margin-top: 12px;
            font-size: 14px;
            word-break: break-word;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 8px;
        }

        .badge.halal { background-color: #10b981; color: white; }
        .badge.haram { background-color: var(--danger); color: white; }
        
        .loader {
            text-align: center;
            color: #64748b;
            font-style: italic;
            display: none;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Halal Live Scanner</h1>
    <p class="subtitle">Scan any product barcode to fetch global ingredients and screen for Halal compliance.</p>

    <div class="scanner-box">
        <!-- Live Camera Viewfinder Element -->
        <div id="interactive" class="viewport"></div>

        <div class="input-row">
            <input type="text" id="barcodeInput" placeholder="Enter barcode number...">
            <button onclick="fetchProductData()">Check Barcode</button>
        </div>
        <button id="cameraToggleBtn" class="camera-btn" onclick="toggleCamera()">📷 Use iPhone Camera Scanner</button>
    </div>

    <div id="loader" class="loader">Fetching live ingredients from global database...</div>

    <div id="resultCard" class="result-card">
        <h2 id="resultTitle"></h2>
        <p id="resultMessage"></p>
        <div class="ingredients-list">
            <strong>Detected Ingredients: </strong><span id="resultIngredients"></span>
        </div>
        <div>
            <span id="resultBadge" class="badge"></span>
        </div>
    </div>
</div>

<script>
    let cameraActive = false;

    async function fetchProductData() {
        if (cameraActive) toggleCamera();
        const barcode = document.getElementById('barcodeInput').value.trim();
        const resultCard = document.getElementById('resultCard');
        const loader = document.getElementById('loader');

        if (!barcode) {
            resultCard.style.display = 'none';
            return;
        }

        resultCard.style.display = 'none';
        loader.style.display = 'block';

        try {
            // Fetch live product info from Open Food Facts API
            const response = await fetch(`https://world.openfoodfacts.org/api/v0/product/${barcode}.json`);
            const data = await response.json();

            loader.style.display = 'none';

            if (data.status === 1) {
                const product = data.product;
                const productName = product.product_name || "Unknown Product";
                const ingredientsText = product.ingredients_text_en || product.ingredients_text || "Ingredients data not available.";

                analyzeHalalCompliance(productName, ingredientsText);
            } else {
                showResult(false, "Product Not Found", "This barcode isn't registered in the global database. Please check ingredients manually on the packaging.", "Unknown ingredients");
            }
        } catch (error) {
            loader.style.display = 'none';
            alert("Error connecting to the internet/database.");
        }
    }

    function analyzeHalalCompliance(productName, ingredients) {
        const lowerIngredients = ingredients.toLowerCase();

        // Prohibited terms check (Pork, Alcohol, Gelatin, Non-halal animal elements)
        const forbiddenWords = [
            'pork', 'bacon', 'ham', 'gelatin', 'lard', 'pepsin', 
            'wine', 'beer', 'alcohol', 'ethanol', 'rum', 'liqueur', 'brandy'
        ];

        let foundViolations = forbiddenWords.filter(word => lowerIngredients.includes(word));

        if (foundViolations.length > 0) {
            showResult(
                false, 
                `Not Halal (Haram): ${productName}`, 
                `Contains prohibited elements: ${foundViolations.join(', ')}.`, 
                ingredients
            );
        } else {
            showResult(
                true, 
                `Likely Halal: ${productName}`, 
                `No explicit pork, alcohol, or gelatin ingredients detected in the live API scan.`, 
                ingredients
            );
        }
    }

    function showResult(isHalal, title, message, ingredients) {
        const resultCard = document.getElementById('resultCard');
        const resultTitle = document.getElementById('resultTitle');
        const resultMessage = document.getElementById('resultMessage');
        const resultIngredients = document.getElementById('resultIngredients');
        const resultBadge = document.getElementById('resultBadge');

        resultCard.style.display = 'block';
        resultIngredients.textContent = ingredients;

        if (isHalal) {
            resultCard.className = 'result-card halal';
            resultTitle.innerHTML = `✅ Halal Verified`;
            resultMessage.textContent = message;
            resultBadge.textContent = 'HALAL';
            resultBadge.className = 'badge halal';
        } else {
            resultCard.className = 'result-card haram';
            resultTitle.innerHTML = `❌ Haram / Avoid`;
            resultMessage.textContent = message;
            resultBadge.textContent = 'HARAM';
            resultBadge.className = 'badge haram';
        }
    }

    // Toggle Camera Viewfinder
    function toggleCamera() {
        const viewport = document.getElementById('interactive');
        const btn = document.getElementById('cameraToggleBtn');

        if (!cameraActive) {
            viewport.style.display = 'block';
            btn.textContent = "🛑 Stop Camera";
            cameraActive = true;

            Quagga.init({
                inputStream: {
                    name: "Live",
                    type: "LiveStream",
                    target: viewport,
                    constraints: { facingMode: "environment" }
                },
                decoder: { readers: ["ean_reader", "ean_8_reader", "upc_reader"] }
            }, function(err) {
                if (err) {
                    alert("Camera access denied or unavailable.");
                    toggleCamera();
                    return;
                }
                Quagga.start();
            });

            Quagga.onDetected(function(result) {
                document.getElementById('barcodeInput').value = result.codeResult.code;
                toggleCamera();
                fetchProductData();
            });
        } else {
            Quagga.stop();
            viewport.style.display = 'none';
            btn.textContent = "📷 Use iPhone Camera Scanner";
            cameraActive = false;
        }
    }
</script>

</body>
</html>
