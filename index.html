<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halal Ingredient Photo Scanner</title>
    <!-- Include Tesseract.js for OCR (Optical Character Recognition) from camera images -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --danger: #ef4444;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        h1 {
            text-align: center;
            color: var(--primary-dark);
            margin-bottom: 8px;
        }

        p.subtitle {
            text-align: center;
            color: #64748b;
            margin-top: 0;
            margin-bottom: 24px;
        }

        .scanner-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        /* Hide default file input and style label as a button */
        .camera-upload-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            padding: 14px 16px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background-color: #3b82f6;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            text-align: center;
        }

        .camera-upload-btn:hover {
            background-color: #2563eb;
        }

        input[type="file"] {
            display: none;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 12px 16px;
            font-size: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            outline: none;
            resize: vertical;
            box-sizing: border-box;
            font-family: inherit;
        }

        button.analyze-btn {
            padding: 12px 16px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background-color: var(--primary);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button.analyze-btn:hover {
            background-color: var(--primary-dark);
        }

        .loader {
            text-align: center;
            color: #64748b;
            font-style: italic;
            display: none;
            margin-bottom: 15px;
        }

        .result-card {
            border-radius: 12px;
            padding: 20px;
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-card.halal {
            background-color: #ecfdf5;
            border: 2px solid #34d399;
            color: #065f46;
        }

        .result-card.haram {
            background-color: #fef2f2;
            border: 2px solid #f87171;
            color: #991b1b;
        }

        .result-card h2 {
            margin-top: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .flagged-list {
            margin-top: 4px;
            font-weight: bold;
            color: var(--danger);
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 12px;
        }

        .badge.halal { background-color: #10b981; color: white; }
        .badge.haram { background-color: var(--danger); color: white; }
    </style>
</head>
<body>

<div class="container">
    <h1>Halal Food Scanner</h1>
    <p class="subtitle">Snap a picture of the ingredient label with your iPhone to screen it.</p>

    <div class="scanner-box">
        <!-- iPhone Camera Capture Input -->
        <label class="camera-upload-btn">
            📷 Take Photo of Ingredients
            <input type="file" accept="image/*" capture="environment" id="cameraInput" onchange="processImage(event)">
        </label>

        <textarea id="ingredientInput" placeholder="Extracted ingredient text will appear here (or you can type/edit manually)..."></textarea>
        <button class="analyze-btn" onclick="checkIngredients()">Analyze Ingredients</button>
    </div>

    <div id="loader" class="loader">Reading text from photo... Please wait (OCR processing).</div>

    <div id="resultCard" class="result-card">
        <h2 id="resultTitle"></h2>
        <p id="resultMessage"></p>
        <div id="flaggedContainer" style="display:none;">
            Flagged Prohibited Elements: <span id="flaggedList" class="flagged-list"></span>
        </div>
        <div>
            <span id="resultBadge" class="badge"></span>
        </div>
    </div>
</div>

<script>
    // Automatically capture photo, extract text using Tesseract OCR, and populate textarea
    async function processImage(event) {
        const file = event.target.files[0];
        if (!file) return;

        const loader = document.getElementById('loader');
        const ingredientInput = document.getElementById('ingredientInput');
        
        loader.style.display = 'block';
        ingredientInput.value = "";

        try {
            // Run Optical Character Recognition on the captured photo
            const { data: { text } } = await Tesseract.recognize(
                file,
                'eng',
                { logger: m => console.log(m) } // Optional progress logging in console
            );

            loader.style.display = 'none';
            // Clean up text spacing and place into textarea
            ingredientInput.value = text.replace(/\n/g, ' ').trim();
            
            // Automatically trigger analysis
            checkIngredients();
        } catch (error) {
            loader.style.display = 'none';
            alert("Could not extract text from image. Please try taking a clearer photo.");
        }
    }

    function checkIngredients() {
        const rawText = document.getElementById('ingredientInput').value.trim();
        const resultCard = document.getElementById('resultCard');
        const resultTitle = document.getElementById('resultTitle');
        const resultMessage = document.getElementById('resultMessage');
        const flaggedContainer = document.getElementById('flaggedContainer');
        const flaggedList = document.getElementById('flaggedList');
        const resultBadge = document.getElementById('resultBadge');

        if (!rawText) {
            resultCard.style.display = 'none';
            return;
        }

        const lowerText = rawText.toLowerCase();

        // Strict forbidden keyword verification (Pork, Alcohol, Gelatin, Non-halal meat)
        const prohibitedKeywords = [
            'pork', 'bacon', 'ham', 'lard', 'gelatin', 'pepsin', 
            'wine', 'beer', 'alcohol', 'ethanol', 'rum', 'liqueur', 'brandy'
        ];

        let foundViolations = prohibitedKeywords.filter(keyword => {
            const regex = new RegExp(`\\b${keyword}\\b`, 'i');
            return regex.test(lowerText);
        });

        resultCard.style.display = 'block';

        if (foundViolations.length > 0) {
            resultCard.className = 'result-card haram';
            resultTitle.innerHTML = `❌ Not Halal (Haram)`;
            resultMessage.textContent = `Prohibited keywords were identified in the scanned ingredient text.`;
            flaggedContainer.style.display = 'block';
            flaggedList.textContent = [...new Set(foundViolations)].join(', ');
            resultBadge.textContent = 'HARAM / AVOID';
            resultBadge.className = 'badge haram';
        } else {
            resultCard.className = 'result-card halal';
            resultTitle.innerHTML = `✅ No Prohibited Elements Found`;
            resultMessage.textContent = `The text scanned from your photo does not show any references to pork, alcohol, dead meat, or gelatin.`;
            flaggedContainer.style.display = 'none';
            resultBadge.textContent = 'LIKELY HALAL';
            resultBadge.className = 'badge halal';
        }
    }
</script>

</body>
</html>
