<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halal Ingredient Scanner</title>
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --danger: #ef4444;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        h1 {
            text-align: center;
            color: var(--primary-dark);
            margin-bottom: 8px;
        }

        p.subtitle {
            text-align: center;
            color: #64748b;
            margin-top: 0;
            margin-bottom: 24px;
        }

        .scanner-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 12px 16px;
            font-size: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            outline: none;
            resize: vertical;
            transition: border-color 0.2s;
            box-sizing: border-box;
            font-family: inherit;
        }

        textarea:focus {
            border-color: var(--primary);
        }

        button {
            padding: 12px 16px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background-color: var(--primary);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-dark);
        }

        .examples {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 20px;
        }

        .examples span {
            display: inline-block;
            background: #f1f5f9;
            padding: 4px 8px;
            border-radius: 4px;
            margin: 2px;
            cursor: pointer;
        }

        .examples span:hover {
            background: #e2e8f0;
        }

        .result-card {
            border-radius: 12px;
            padding: 20px;
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-card.halal {
            background-color: #ecfdf5;
            border: 2px solid #34d399;
            color: #065f46;
        }

        .result-card.haram {
            background-color: #fef2f2;
            border: 2px solid #f87171;
            color: #991b1b;
        }

        .result-card h2 {
            margin-top: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .flagged-list {
            margin-top: 8px;
            font-weight: bold;
            color: var(--danger);
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 12px;
        }

        .badge.halal { background-color: #10b981; color: white; }
        .badge.haram { background-color: var(--danger); color: white; }
    </style>
</head>
<body>

<div class="container">
    <h1>Halal Ingredient Scanner</h1>
    <p class="subtitle">Paste or type product ingredients to screen for pork, alcohol, dead meat, and gelatin.</p>

    <div class="scanner-box">
        <textarea id="ingredientInput" placeholder="Paste ingredients here (e.g., Sugar, water, pork gelatin, natural flavors)..."></textarea>
        <button onclick="checkIngredients()">Scan Ingredients</button>
    </div>

    <div class="examples">
        Try an example: 
        <span onclick="setExample('Sugar, corn syrup, pork gelatin, citric acid, artificial colors')">Gummies (Haram)</span>
        <span onclick="setExample('Enriched flour, water, yeast, salt, vegetable oil, tomato sauce')">Bread & Sauce (Halal)</span>
        <span onclick="setExample('Water, sugar, vanilla extract, chocolate, emulsifiers')">Vanilla Cake (Alcohol risk)</span>
    </div>

    <div id="resultCard" class="result-card">
        <h2 id="resultTitle"></h2>
        <p id="resultMessage"></p>
        <div id="flaggedContainer" style="display:none;">
            Flagged Ingredients: <span id="flaggedList" class="flagged-list"></span>
        </div>
        <div>
            <span id="resultBadge" class="badge"></span>
        </div>
    </div>
</div>

<script>
    function setExample(text) {
        document.getElementById('ingredientInput').value = text;
        checkIngredients();
    }

    function checkIngredients() {
        const rawText = document.getElementById('ingredientInput').value.trim();
        const resultCard = document.getElementById('resultCard');
        const resultTitle = document.getElementById('resultTitle');
        const resultMessage = document.getElementById('resultMessage');
        const flaggedContainer = document.getElementById('flaggedContainer');
        const flaggedList = document.getElementById('flaggedList');
        const resultBadge = document.getElementById('resultBadge');

        if (!rawText) {
            resultCard.style.display = 'none';
            return;
        }

        const lowerText = rawText.toLowerCase();

        // Prohibited/Haram keywords check
        const prohibitedKeywords = [
            'pork', 'bacon', 'ham', 'lard', 'gelatin', 'pepsin', 
            'wine', 'beer', 'alcohol', 'ethanol', 'rum', 'liqueur', 'brandy', 'non-halal meat'
        ];

        // Find which specific banned words appear in the text
        let foundViolations = prohibitedKeywords.filter(keyword => {
            // Match whole words to avoid partial bugs
            const regex = new RegExp(`\\b${keyword}\\b`, 'i');
            return regex.test(lowerText);
        });

        resultCard.style.display = 'block';

        if (foundViolations.length > 0) {
            // Haram Case
            resultCard.className = 'result-card haram';
            resultTitle.innerHTML = `❌ Not Halal (Haram)`;
            resultMessage.textContent = `Warning: Prohibited ingredients were detected in this list.`;
            flaggedContainer.style.display = 'block';
            flaggedList.textContent = [...new Set(foundViolations)].join(', ');
            resultBadge.textContent = 'HARAM / AVOID';
            resultBadge.className = 'badge haram';
        } else {
            // Halal Case
            resultCard.className = 'result-card halal';
            resultTitle.innerHTML = `✅ No Prohibited Ingredients Found`;
            resultMessage.textContent = `The scanned ingredient text does not contain explicit mentions of pork, alcohol, dead meat, or gelatin.`;
            flaggedContainer.style.display = 'none';
            resultBadge.textContent = 'LIKELY HALAL';
            resultBadge.className = 'badge halal';
        }
    }
</script>

</body>
</html>
