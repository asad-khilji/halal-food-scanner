<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halal Food Scanner</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --danger: #ef4444;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        h1 {
            text-align: center;
            color: var(--primary-dark);
            margin-bottom: 8px;
        }

        p.subtitle {
            text-align: center;
            color: #64748b;
            margin-top: 0;
            margin-bottom: 24px;
        }

        .scanner-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            font-size: 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        button {
            padding: 12px 16px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background-color: var(--primary);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-dark);
        }

        .camera-btn {
            background-color: #3b82f6;
        }
        .camera-btn:hover {
            background-color: #2563eb;
        }

        /* Camera Viewport Styling */
        #interactive.viewport {
            position: relative;
            width: 100%;
            height: 250px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            display: none;
            margin-bottom: 12px;
        }
        #interactive.viewport video, canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .examples {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 20px;
        }

        .examples span {
            display: inline-block;
            background: #f1f5f9;
            padding: 4px 8px;
            border-radius: 4px;
            margin: 2px;
            cursor: pointer;
        }

        .examples span:hover {
            background: #e2e8f0;
        }

        .result-card {
            border-radius: 12px;
            padding: 20px;
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-card.halal {
            background-color: #ecfdf5;
            border: 2px solid #34d399;
            color: #065f46;
        }

        .result-card.haram {
            background-color: #fef2f2;
            border: 2px solid #f87171;
            color: #991b1b;
        }

        .result-card h2 {
            margin-top: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ingredients-list {
            margin-top: 12px;
            font-size: 14px;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 8px;
        }

        .badge.halal { background-color: #10b981; color: white; }
        .badge.haram { background-color: var(--danger); color: white; }
    </style>
</head>
<body>

<div class="container">
    <h1>Halal Food Scanner</h1>
    <p class="subtitle">Scan barcodes via iPhone camera or search items manually.</p>

    <div class="scanner-box">
        <div id="interactive" class="viewport"></div>

        <div class="input-row">
            <input type="text" id="foodInput" placeholder="Enter food name or barcode...">
            <button onclick="scanFood()">Search</button>
        </div>
        <button id="cameraToggleBtn" class="camera-btn" onclick="toggleCamera()">📷 Use iPhone Camera Scanner</button>
    </div>

    <div class="examples">
        Try clicking an item: 
        <span onclick="setSearch('Beef Burger')">Beef Burger</span>
        <span onclick="setSearch('Gummy Bears')">Gummy Bears</span>
        <span onclick="setSearch('Vanilla Cake')">Vanilla Cake</span>
        <span onclick="setSearch('Pepperoni Pizza')">Pepperoni Pizza</span>
    </div>

    <div id="resultCard" class="result-card">
        <h2 id="resultTitle"></h2>
        <p id="resultMessage"></p>
        <div class="ingredients-list">
            <strong>Ingredients: </strong><span id="resultIngredients"></span>
        </div>
        <div>
            <span id="resultBadge" class="badge"></span>
        </div>
    </div>
</div>

<script>
    // Expanded Mock JSON Database mapping both text names and barcodes
    const foodDatabase = [
        {
            "keys": ["beef burger", "012345678905"],
            "name": "Beef Burger",
            "isHalal": true,
            "ingredients": ["Halal Beef Patty", "Bun", "Lettuce", "Tomato", "Mayonnaise"],
            "reason": "Contains no prohibited ingredients."
        },
        {
            "keys": ["gummy bears", "070923123456"],
            "name": "Gummy Bears",
            "isHalal": false,
            "ingredients": ["Sugar", "Corn Syrup", "Pork Gelatin", "Citric Acid"],
            "reason": "Contains pork gelatin, which is prohibited."
        },
        {
            "keys": ["vanilla cake", "054321098765"],
            "name": "Vanilla Cake",
            "isHalal": false,
            "ingredients": ["Flour", "Sugar", "Eggs", "Vanilla Extract (contains alcohol)", "Butter"],
            "reason": "Contains vanilla extract containing alcohol."
        },
        {
            "keys": ["pepperoni pizza", "098765432101"],
            "name": "Pepperoni Pizza",
            "isHalal": false,
            "ingredients": ["Dough", "Tomato Sauce", "Mozzarella Cheese", "Pork Pepperoni"],
            "reason": "Contains pork pepperoni."
        }
    ];

    let cameraActive = false;

    function setSearch(itemName) {
        if (cameraActive) toggleCamera(); // Turn off camera if active
        document.getElementById('foodInput').value = itemName;
        scanFood();
    }

    function scanFood() {
        if (cameraActive) toggleCamera();
        const query = document.getElementById('foodInput').value.trim().toLowerCase();
        const resultCard = document.getElementById('resultCard');
        const resultTitle = document.getElementById('resultTitle');
        const resultMessage = document.getElementById('resultMessage');
        const resultIngredients = document.getElementById('resultIngredients');
        const resultBadge = document.getElementById('resultBadge');

        if (!query) {
            resultCard.style.display = 'none';
            return;
        }

        // Search database keys (matches name or barcode)
        const foundItem = foodDatabase.find(item => 
            item.keys.some(key => key.toLowerCase().includes(query))
        );

        resultCard.style.display = 'block';

        if (foundItem) {
            resultIngredients.textContent = foundItem.ingredients.join(', ');
            
            if (foundItem.isHalal) {
                resultCard.className = 'result-card halal';
                resultTitle.innerHTML = `✅ Halal Verified`;
                resultMessage.textContent = `"${foundItem.name}" is safe to consume. ${foundItem.reason}`;
                resultBadge.textContent = 'HALAL';
                resultBadge.className = 'badge halal';
            } else {
                resultCard.className = 'result-card haram';
                resultTitle.innerHTML = `❌ Not Halal (Haram)`;
                resultMessage.textContent = `"${foundItem.name}" is not recommended. ${foundItem.reason}`;
                resultBadge.textContent = 'HARAM / AVOID';
                resultBadge.className = 'badge haram';
            }
        } else {
            resultCard.className = 'result-card haram';
            resultTitle.innerHTML = `⚠️ Unknown Item`;
            resultMessage.textContent = `Barcode/Item "${query}" not found in database. Check label for pork, alcohol, dead meat, or gelatin.`;
            resultIngredients.textContent = 'Unknown';
            resultBadge.textContent = 'UNVERIFIED';
            resultBadge.className = 'badge haram';
        }
    }

    // Toggle QuaggaJS Camera Stream for iPhone/Mobile
    function toggleCamera() {
        const viewport = document.getElementById('interactive');
        const btn = document.getElementById('cameraToggleBtn');

        if (!cameraActive) {
            viewport.style.display = 'block';
            btn.textContent = "🛑 Stop Camera";
            cameraActive = true;

            Quagga.init({
                inputStream: {
                    name: "Live",
                    type: "LiveStream",
                    target: viewport,
                    constraints: {
                        facingMode: "environment" // Uses rear iPhone camera
                    }
                },
                decoder: {
                    readers: ["ean_reader", "ean_8_reader", "upc_reader"]
                }
            }, function(err) {
                if (err) {
                    console.error(err);
                    alert("Unable to access camera. Check permissions.");
                    toggleCamera();
                    return;
                }
                Quagga.start();
            });

            Quagga.onDetected(function(result) {
                const code = result.codeResult.code;
                document.getElementById('foodInput').value = code;
                toggleCamera(); // Stop camera once scanned
                scanFood();     // Automatically process item
            });

        } else {
            Quagga.stop();
            viewport.style.display = 'none';
            btn.textContent = "📷 Use iPhone Camera Scanner";
            cameraActive = false;
        }
    }
</script>

</body>
</html>
